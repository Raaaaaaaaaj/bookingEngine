<div class="container my-4">
  <div class="card flex justify-center p-4">
    <p-stepper [(value)]="currentStep" class="basis-[50rem]" [linear]="true">
      <p-step-list>
        <p-step *ngFor="let step of steps; let i = index" [value]="i + 1">
          {{ step }}
        </p-step>
      </p-step-list>
      <p-step-panels>
        <p-step-panel *ngFor="let step of steps; let i = index" [value]="i + 1">
          <ng-template #content>
            <div class="border-2 border-dashed border-surface-200 rounded bg-surface-50 flex-auto flex justify-center items-center font-medium">
              {{ step }} Content
            </div>
            <div class="d-flex pt-6 justify-content-end gap-2">
              <p-button *ngIf="currentStep > 1" label="Back" severity="secondary" icon="pi pi-arrow-left"
                (onClick)="prevStep()" />
              <p-button *ngIf=" currentStep < steps.length" label="Next" icon="pi pi-arrow-right" iconPos="right"
                (onClick)="nextStep()" />
            </div>
          </ng-template>
        </p-step-panel>
      </p-step-panels>
    </p-stepper>
  </div>
</div>
