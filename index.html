<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stepper Design</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .stepper {
            width: 360px;
            background: #fff;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .step {
            display: flex;
            align-items: center;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 8px;
            font-weight: 500;
            background: #f8f9fa;
            color: #6c757d;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .step.active {
            background: #f3ecff;
            border-color: #8b3dff;
            color: #4b0082;
            font-weight: 600;
        }

        .step.active::after {
            content: "";
            position: absolute;
            right: -12px;
            top: 50%;
            transform: translateY(-50%);
            border-left: 12px solid #8b3dff;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
        }

        .step-number {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            background: #eaeaea;
            color: #6c757d;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .step.active .step-number {
            background: #8b3dff;
            color: #fff;
        }

        .step-text {
            flex: 1;
            font-size: 15px;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

    <div class="stepper">
        <div class="step active">
            <div class="step-number">1</div>
            <div class="step-text">Understand Your Child’s Needs</div>
        </div>
        <div class="step">
            <div class="step-number">2</div>
            <div class="step-text">Location and Accessibility</div>
        </div>
        <div class="step">
            <div class="step-number">3</div>
            <div class="step-text">Curriculum and Learning Approach</div>
        </div>
    </div>

    <script>
        const steps = document.querySelectorAll('.step');

        steps.forEach(step => {
            step.addEventListener('click', () => {
                // Remove active from all
                steps.forEach(s => s.classList.remove('active'));
                // Add active to clicked one
                step.classList.add('active');
            });
        });
    </script>

</body>

</html>
